[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "context7-client"
version = "0.1.0"
description = "Small Python client for the Context7 documentation API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Alexandr Khrustalev" }]
dependencies = []

[project.urls]
Source = "https://github.com/SanderSaxBuilds/context7-python"

[tool.setuptools.packages.find]
where = ["src"]
